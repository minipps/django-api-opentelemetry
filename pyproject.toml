[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "django-ninja-opentelemetry"
version = "0.1.0"
description = "OpenTelemetry traces, metrics and exception logs for Django and Django Ninja"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.2",
    "opentelemetry-api>=1.44,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
ninja = ["django-ninja>=1.7,<1.8"]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "django-stubs>=5.2",
    "httpx>=0.27",
    "opentelemetry-instrumentation-django[asgi]>=0.65b0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
    "ruff>=0.9",
    "twine>=6",
    "ty>=0.0.1",
    "uv_build>=0.13,<0.14",
    "uvicorn>=0.34",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.project.settings"
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
