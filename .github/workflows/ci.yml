name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to validate; defaults to the triggering commit
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.13.5"

jobs:
  lint:
    name: Compose, lint and type checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build CI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ci
          load: true
          tags: django-ninja-otel-ci:lint
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            UV_VERSION=${{ env.UV_VERSION }}
          cache-from: type=gha,scope=ci-3.14
          cache-to: type=gha,mode=max,scope=ci-3.14
          provenance: false

      - name: Run lint, type, self-checks and default-environment pytest
        run: >-
          docker run --rm django-ninja-otel-ci:lint
          bash -c 'scripts/check-dist.py --self-test &&
          scripts/check-release.py --self-test &&
          scripts/check.sh all'

  tests:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ci
          load: true
          tags: django-ninja-otel-ci:py${{ matrix.python-version }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            UV_VERSION=${{ env.UV_VERSION }}
          cache-from: type=gha,scope=ci-${{ matrix.python-version }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.python-version }}
          provenance: false

      - name: Run compatibility test environment
        run: |
          set -euo pipefail
          mkdir -p test-results
          chmod 0777 test-results
          docker run --rm \
            --volume "$PWD/test-results:/workspace/test-results" \
            --env COMPAT_EXTRAS=ninja,drf,otlp \
            "django-ninja-otel-ci:py${{ matrix.python-version }}" \
            bash -c 'set -euo pipefail; scripts/compat.sh "Django~=${{ matrix.django }}.0" "django-ninja==1.7.1" "djangorestframework==3.18.3"; /tmp/compat-venv/bin/python -m pytest --junitxml=/workspace/test-results/pytest.xml'

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-py${{ matrix.python-version }}-django-${{ matrix.django }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: Compatibility ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ninja 1.7.0
            python-version: "3.12"
            extras: ninja,otlp
            requirements: "Django~=5.2.0 django-ninja==1.7.0"
          - name: DRF 3.16.1 baseline
            python-version: "3.12"
            extras: ninja,drf,otlp
            requirements: "Django~=5.2.0 django-ninja==1.7.1 djangorestframework==3.16.1"
          - name: DRF 3.17.2 baseline
            python-version: "3.12"
            extras: ninja,drf,otlp
            requirements: "Django~=5.2.0 django-ninja==1.7.1 djangorestframework==3.17.2"
          - name: plain Django without Ninja or DRF
            python-version: "3.12"
            extras: otlp
            requirements: "Django~=5.2.0"
          - name: API-only without SDK/exporters
            python-version: "3.12"
            extras: ninja,drf
            requirements: "Django~=5.2.0 django-ninja==1.7.1 djangorestframework==3.18.3"
          - name: DRF without Ninja
            python-version: "3.12"
            extras: drf,otlp
            requirements: "Django~=5.2.0 djangorestframework==3.18.3"
          - name: OpenTelemetry 1.44 baseline
            python-version: "3.12"
            extras: ninja,drf,otlp
            requirements: "Django~=5.2.0 django-ninja==1.7.1 djangorestframework==3.18.3 opentelemetry-api==1.44.0 opentelemetry-sdk==1.44.0 opentelemetry-exporter-otlp-proto-http==1.44.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ci
          load: true
          tags: django-ninja-otel-ci:compat-${{ matrix.python-version }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            UV_VERSION=${{ env.UV_VERSION }}
          cache-from: type=gha,scope=ci-${{ matrix.python-version }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.python-version }}
          provenance: false

      - name: Run compatibility test environment
        run: |
          set -euo pipefail
          mkdir -p test-results
          chmod 0777 test-results
          docker run --rm \
            --volume "$PWD/test-results:/workspace/test-results" \
            --env "COMPAT_EXTRAS=${{ matrix.extras }}" \
            "django-ninja-otel-ci:compat-${{ matrix.python-version }}" \
            bash -c 'set -euo pipefail; scripts/compat.sh ${{ matrix.requirements }}; /tmp/compat-venv/bin/python -m pytest --junitxml=/workspace/test-results/pytest.xml'

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  artifacts:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build verification image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ci
          load: true
          tags: django-ninja-otel-ci:artifacts
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            UV_VERSION=${{ env.UV_VERSION }}
          cache-from: type=gha,scope=ci-3.14
          cache-to: type=gha,mode=max,scope=ci-3.14
          provenance: false

      - name: Remove stale distributions
        run: rm -rf dist

      - name: Build wheel and sdist once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dist
          outputs: type=local,dest=dist
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            UV_VERSION=${{ env.UV_VERSION }}
          cache-from: type=gha,scope=ci-3.14
          provenance: false

      # Buildx exports dist as 0700; the runner and verifier use different UIDs.
      - name: Normalize exported distribution permissions
        run: |
          set -euo pipefail
          chmod 0755 dist
          chmod 0644 dist/*.whl dist/*.tar.gz

      - name: Verify distributions outside the source tree
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD/dist:/dist:ro" \
            django-ninja-otel-ci:artifacts \
            bash -c 'scripts/check-dist.py --self-test && scripts/check-dist.py /dist'

      - name: Record distribution hashes
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload checked distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  collector-smoke:
    name: Collector smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: artifacts
    env:
      COMPOSE_PROJECT_NAME: django-ninja-otel-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download checked distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify exact checked distributions
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          ls -l

      - name: Start collector
        run: docker compose -p "$COMPOSE_PROJECT_NAME" --profile telemetry up -d --wait collector

      - name: Run collector smoke test
        run: docker compose -p "$COMPOSE_PROJECT_NAME" --profile telemetry run --rm smoke

      - name: Capture collector logs
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" --profile telemetry logs --no-color > collector.log 2>&1 || true

      - name: Upload collector logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector-logs
          path: collector.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down collector
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" --profile telemetry down -v --remove-orphans
