name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate tag and package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Checkout tagged commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Check tag matches package metadata
        id: metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          output="$(docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            --env TAG \
            python:3.12-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2 \
            sh -c 'python -m pip install --quiet --no-cache-dir "packaging==26.3" && python scripts/check-release.py --tag "$TAG" --pyproject pyproject.toml')"
          printf '%s\n' "$output"
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"

  ci:
    name: Reusable CI on tagged commit
    needs: release-gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  publish-testpypi:
    name: Publish prerelease to TestPyPI
    needs: [release-gate, ci]
    if: needs.release-gate.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/django-api-opentelemetry/
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify exact checked distributions
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          rm SHA256SUMS
          ls -l

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: Publish stable release to PyPI
    needs: [release-gate, ci]
    if: needs.release-gate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-api-opentelemetry/
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify exact checked distributions
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          rm SHA256SUMS
          ls -l

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          repository-url: https://upload.pypi.org/legacy/
          attestations: true
