name: Release

on:
  push:
    tags: ["v*", "!v*-recovery"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Release runs never cancel one another. The reusable CI workflow uses the
  # separate ci-* namespace, so its cancellation policy cannot affect this run.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"

jobs:
  release-gate:
    name: Validate tag and package version
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Checkout tagged commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        id: source
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # Build only after the tag commit is proven to be on main. The ci target
      # is the uv-locked development environment; no ad-hoc package
      # installation step is used to obtain the release-check dependencies.
      - name: Build locked CI environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ci
          load: true
          tags: django-ninja-otel-ci:release-gate
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          provenance: false

      - name: Self-test release gate checks
        run: >-
          docker run --rm django-ninja-otel-ci:release-gate
          python scripts/check-release.py --self-test

      - name: Check tag matches package metadata
        id: metadata
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          output="$(docker run --rm \
            --env TAG \
            django-ninja-otel-ci:release-gate \
            python scripts/check-release.py --tag "$TAG" --pyproject pyproject.toml)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"

  ci:
    name: Reusable CI on tagged commit
    needs: release-gate
    if: >-
      needs.release-gate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v')
    uses: $/.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-gate.outputs.commit }}
    permissions:
      contents: read

  publish-testpypi:
    name: Publish prerelease to TestPyPI
    needs: [release-gate, ci]
    if: >-
      needs.release-gate.result == 'success' &&
      needs.ci.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.release-gate.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/django-api-opentelemetry/
    permissions:
      id-token: write  # PyPA OIDC trusted publishing and PEP 740 attestations
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify exact checked distributions
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          rm SHA256SUMS
          ls -l

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: Publish stable release to PyPI
    needs: [release-gate, ci]
    if: >-
      needs.release-gate.result == 'success' &&
      needs.ci.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.release-gate.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/django-api-opentelemetry/
    permissions:
      id-token: write  # PyPA OIDC trusted publishing and PEP 740 attestations
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify exact checked distributions
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          rm SHA256SUMS
          ls -l

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          repository-url: https://upload.pypi.org/legacy/
          attestations: true
